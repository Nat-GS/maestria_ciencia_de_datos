<!doctype html>
<html lang="es">
<meta charset="utf-8">
<style>
body { margin: 0; font-family: Arial, sans-serif; color: #284955; }
button { background: white; color: #284955; border: 1px solid #cbd5dc;
  border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
button:hover { border-color: #237d78; color: #237d78; }
button:disabled { opacity: .6; cursor: wait; }
#status { font-size: 12px; margin-top: 7px; }
</style>
<button id="download" type="button">Descargar árbol en PNG</button>
<div id="status" role="status" aria-live="polite"></div>
<script>
// Exportar el SVG real de Streamlit: misma profundidad, reglas y colores.
// No vuelve a dibujar el árbol ni requiere servicios o dependencias externas.
document.getElementById('download').addEventListener('click', async () => {
  const button = document.getElementById('download');
  const status = document.getElementById('status');
  let svgUrl, pngUrl;
  button.disabled = true;
  status.textContent = 'Preparando imagen…';
  try {
    const parentDocument = window.parent.document;
    const source = Array.from(parentDocument.querySelectorAll('[data-testid="stGraphVizChart"] svg'))
      .find(element => element.getBoundingClientRect().width > 0);
    if (!source) throw new Error('Espera a que el diagrama termine de mostrarse y vuelve a intentar.');
    const bounds = source.getBBox();
    if (!bounds.width || !bounds.height) throw new Error('El árbol todavía no está disponible.');
    const clone = source.cloneNode(true);
    const originals = [source, ...source.querySelectorAll('*')];
    const copies = [clone, ...clone.querySelectorAll('*')];
    const properties = ['font-family', 'font-size', 'font-weight', 'font-style',
      'fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-opacity',
      'stroke-dasharray', 'opacity', 'text-anchor', 'dominant-baseline',
      'marker-start', 'marker-end'];
    originals.forEach((element, index) => {
      const computed = window.parent.getComputedStyle(element);
      for (const property of properties) {
        // Las referencias internas deben seguir apuntando al SVG clonado.
        const value = computed.getPropertyValue(property)
          .replace(/url\(["']?[^\)"']*#([^\)"']+)["']?\)/g, 'url(#$1)');
        copies[index].style.setProperty(property, value);
      }
    });
    const padding = 24;
    const width = Math.ceil(bounds.width + padding * 2);
    const height = Math.ceil(bounds.height + padding * 2);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('viewBox', `${bounds.x-padding} ${bounds.y-padding} ${width} ${height}`);
    clone.setAttribute('width', width);
    clone.setAttribute('height', height);
    clone.style.width = `${width}px`;
    clone.style.height = `${height}px`;
    clone.style.maxWidth = 'none';
    svgUrl = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],
      {type: 'image/svg+xml;charset=utf-8'}));
    const image = new Image();
    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(new Error('No fue posible convertir el diagrama a imagen.'));
      image.src = svgUrl;
    });
    // Limitar memoria en árboles completos grandes; resolución doble si cabe.
    const scale = Math.min(2, 16000 / width, 16000 / height, Math.sqrt(32000000 / (width * height)));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.ceil(width * scale));
    canvas.height = Math.max(1, Math.ceil(height * scale));
    const context = canvas.getContext('2d');
    if (!context) throw new Error('El navegador no puede generar imágenes PNG.');
    context.fillStyle = '#ffffff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    const png = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!png) throw new Error('No fue posible generar el PNG.');
    pngUrl = URL.createObjectURL(png);
    const link = document.createElement('a');
    link.href = pngUrl;
    link.download = 'arbol_decision.png';
    document.body.appendChild(link);
    link.click();
    link.remove();
    status.textContent = 'Imagen descargada con los niveles seleccionados.';
  } catch (error) {
    status.textContent = error.message || 'No se pudo descargar la imagen. Inténtalo de nuevo.';
  } finally {
    // Dar tiempo al navegador para iniciar la descarga antes de liberar memoria.
    setTimeout(() => {
      if (svgUrl) URL.revokeObjectURL(svgUrl);
      if (pngUrl) URL.revokeObjectURL(pngUrl);
    }, 10000);
    button.disabled = false;
  }
});
</script>
</html>
